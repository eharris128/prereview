[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prereview"
version = "0.1.0"
description = "AI-assisted pre-submission review of academic preprints, with verification of every cited reference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Evan Harris" }]
dependencies = [
    "httpx>=0.27",
    "litellm>=1.50",
    "pydantic>=2.7",
    "pypdf>=4.2",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
# Claude Code OAuth auth path (opt-in via --auth oauth). Kept optional so the
# default install stays light: the SDK pulls in mcp/jsonschema/anyio, and the
# feature additionally needs the `claude` CLI on PATH.
oauth = [
    "claude-agent-sdk>=0.2.147",
]
# OpenReview decision enrichment (U8, opt-in via --openreview). Kept optional so the
# default install stays light and network-free; the feature degrades cleanly when absent.
openreview = [
    "openreview-py>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/eharris128/prereview"
Issues = "https://github.com/eharris128/prereview/issues"

[project.scripts]
prereview = "prereview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prereview"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
